{% include "bases/header.html" %} 
{% include "bases/navbar.html" %}

{% if message %}
        <div class="card bg-danger slidein" style="color:aliceblue;">
            <div class="card-body">
                <h4 class="card-title">Algo salio mal</h4>
                <p class="card-text">{{message}}</p>
            </div>
        </div>
{% endif %}

<form id="loginForm" action="/createuser" method="post" enctype="multipart/form-data" style="width:50%; margin-left: 25%">
        <!---Firstname-->
        <div class="mb-3">
            <label for="" class="form-label">Firstname</label>
            <input
                type="text"
                class="form-control"
                name="firstname"
                id=""
                aria-describedby="helpId"
                placeholder=""
                required
            />
        </div>
            <!---Lastname-->
        <div class="mb-3">
            <label for="" class="form-label">Lastname</label>
            <input
                type="text"
                class="form-control"
                name="lastname"
                id=""
                aria-describedby="helpId"
                placeholder=""
                required
            />
        </div>
        <!---Email-->
        <div class="mb-3">
            <label for="" class="form-label">Email</label>
            <input
                type="email"
                class="form-control"
                name="email"
                id=""
                aria-describedby="emailHelpId"
                placeholder="abc@mail.com"
            />
        </div>
            <!---RFC-->
        <div class="mb-3">
            <label for="" class="form-label">RFC</label>
            <input
                type="text"
                class="form-control"
                name="rfc"
                id=""
                aria-describedby="helpId"
                placeholder=""
                minlength="12"
                maxlength="12"
                required
            />
        </div>
            <!---CURP-->
        <div class="mb-3">
            <label for="" class="form-label">CURP</label>
            <input
                type="text"
                class="form-control"
                name="curp"
                id=""
                aria-describedby="helpId"
                placeholder=""
                required
            />
        </div>
        <!---Fecha de nacimiento-->
        <div class="mb-3">
            <label for="" class="form-label">Fecha de nacimiento</label>
            <input
                type="date"
                id="start"
                name="nac"
                value="2026-10-11"
                min="1920-01-01"
                max="2026-10-11" 
                required/>
        <span class="validity" style="color: aliceblue;"></span>
        </div>
        <!---Telefono-->
        <div class="mb-3">
            <label for="" class="form-label">Phone number</label>
            <input
                type="number"
                class="form-control"
                name="tel"
                id=""
                aria-describedby="helpId"
                placeholder=""
                required
            />
        </div>
        <!---Telefono emergencia-->
        <div class="mb-3">
            <label for="" class="form-label">Emergency Phone number</label>
            <input
                type="number"
                class="form-control"
                name="emTel"
                id=""
                aria-describedby="helpId"
                placeholder=""
            />
        </div>
        <!---Calle-->
        <div class="mb-3">
            <label for="" class="form-label">Streat</label>
            <input
                type="text"
                class="form-control"
                name="call"
                id=""
                aria-describedby="helpId"
                placeholder=""
                required
            />
        </div>
        <!---Numero-->
        <div class="mb-3">
            <label for="" class="form-label">Numero de casa</label>
            <input
                type="text"
                class="form-control"
                name="nCasa"
                id=""
                aria-describedby="helpId"
                placeholder=""
                required
            />
        </div>
        <!---Colonia-->
        <div class="mb-3">
            <label for="" class="form-label">Residence</label>
            <input
                type="text"
                class="form-control"
                name="col"
                id=""
                aria-describedby="helpId"
                placeholder=""
                required
            />
        </div>
        <!---Codigo postal-->
        <div class="mb-3">
            <label for="" class="form-label">Postal code</label>
            <input
                type="number"
                class="form-control"
                name="cp"
                id=""
                aria-describedby="helpId"
                placeholder=""
                required
            />
        </div>
        <!---Imagen usuario-->
        <div class="mb-3">
            <label for="" class="form-label">User profile picture</label>
            <input
                type="file"
                class="form-control"
                name="imgPic"
                id=""
                aria-describedby="helpId"
                placeholder=""
            />
        </div>
        <!---Imagen de fondo-->
        <div class="mb-3">
            <label for="" class="form-label">User background picture</label>
            <input
                type="file"
                class="form-control"
                name="imgBack"
                id=""
                aria-describedby="helpId"
                placeholder=""
            />
        </div>
        <!---Rol-->
        <div class="mb-3">
            <label for="" class="form-label">Rol</label>
            <select name="rol" value ="usuario">
                <option value="usuario">Usuario</option>
                <option value="admin">Administrador</option>
            </select>
        </div>
        <!---User Name-->
        <div class="mb-3">
            <label for="" class="form-label">User Name</label>
            <input
                type="text"
                class="form-control"
                name="user"
                id=""
                aria-describedby="helpId"
                placeholder=""
                required
            />
        </div>
        
        <!--Password-->
        <div class="mb-3">
            <label for="" class="form-label">Password</label>
            <input
                type="password"
                class="form-control"
                name="pass"
                id=""
                placeholder=""
                minlength="8"
                required
            />
        </div>
        
        <div class="d-grid gap-2">
            <button
                type="submit"
                name=""
                id=""
                class="btn btn-primary box-shadow-white"
            > Create user
            </button>
        </div>
    </form> 
</div>

{% include "bases/footer.html" %}
