{% include "bases/header.html" %} 
{% include "bases/navbar.html" %}

{% if message %}
        <div class="card bg-danger slidein" style="color:aliceblue; margin-top:3%;">
            <div class="card-body">
                <h4 class="card-title">Algo salio mal</h4>
                <p class="card-text">{{message}}</p>
            </div>
        </div>
{% endif %}

<form id="loginForm" action="/createuser" method="post" enctype="multipart/form-data" class="container mt-4">

    <!-- Nombre y Apellido -->
    <div class="row mb-3">
        <div class="col-md-6">
            <label class="form-label">Firstname</label>
            <input type="text" class="form-control" name="firstname" required>
        </div>
        <div class="col-md-6">
            <label class="form-label">Lastname</label>
            <input type="text" class="form-control" name="lastname" required>
        </div>
    </div>

    <!-- Email -->
    <div class="row mb-3">
        <div class="col-md-12">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" name="email" placeholder="abc@mail.com">
        </div>
    </div>

    <!-- RFC y CURP -->
    <div class="row mb-3">
        <div class="col-md-6">
            <label class="form-label">RFC</label>
            <input type="text" class="form-control" name="rfc" minlength="12" maxlength="12" required>
        </div>
        <div class="col-md-6">
            <label class="form-label">CURP</label>
            <input type="text" class="form-control" name="curp" required>
        </div>
    </div>

    <!-- Fecha de nacimiento -->
    <div class="row mb-3">
        <div class="col-md-6">
            <label class="form-label">Fecha de nacimiento</label>
            <input type="date" class="form-control" name="nac" min="1920-01-01" max="2026-10-11" required>
        </div>
    </div>

    <!-- Teléfonos -->
    <div class="row mb-3">
        <div class="col-md-6">
            <label class="form-label">Phone number</label>
            <input type="number" class="form-control" name="tel" required>
        </div>
        <div class="col-md-6">
            <label class="form-label">Emergency Phone number</label>
            <input type="number" class="form-control" name="emTel">
        </div>
    </div>

    <!-- Dirección -->
    <div class="row mb-3">
        <div class="col-md-6">
            <label class="form-label">Street</label>
            <input type="text" class="form-control" name="call" required>
        </div>
        <div class="col-md-6">
            <label class="form-label">House number</label>
            <input type="text" class="form-control" name="nCasa" required>
        </div>
    </div>

    <div class="row mb-3">
        <div class="col-md-6">
            <label class="form-label">Residence</label>
            <input type="text" class="form-control" name="col" required>
        </div>
        <div class="col-md-6">
            <label class="form-label">Postal code</label>
            <input type="number" class="form-control" name="cp" required>
        </div>
    </div>

    <!-- Imágenes -->
    <div class="row mb-3">
        <div class="col-md-6">
            <label class="form-label">User profile picture</label>
            <input type="file" class="form-control" name="imgPic">
        </div>
        <div class="col-md-6">
            <label class="form-label">User background picture</label>
            <input type="file" class="form-control" name="imgBack">
        </div>
    </div>

    <!-- Rol -->
    <div class="row mb-3">
        <div class="col-md-6">
            <label class="form-label">Rol</label>
            <select class="form-select" name="rol">
                <option value="usuario">Usuario</option>
                <option value="admin">Administrador</option>
            </select>
        </div>
    </div>

    <!-- Usuario y contraseña -->
    <div class="row mb-3">
        <div class="col-md-6">
            <label class="form-label">User Name</label>
            <input type="text" class="form-control" name="user" required>
        </div>
        <div class="col-md-6">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" name="pass" minlength="8" required>
        </div>
    </div>

    <!-- Botón -->
    <div class="d-grid gap-2">
        <button type="submit" class="btn btn-primary">Create user</button>
    </div>
</form>

{% include "bases/footer.html" %}
