{% include "bases/header.html" %}
<div
    class="main container"
>
    <div
    class="row justify-content-center align-items-center g-2"
    >
    {% if message %}
        <div class="card bg-danger slidein" style="color:aliceblue;">
            <div class="card-body">
                <h4 class="card-title">Acceso denegado</h4>
                <p class="card-text">{{message}}</p>
            </div>
        </div>
    {% endif %}
    <!--- Form -->
    <div
        class="col-12 col-md-6    "
    >
        <form id="loginForm" action="/login" method="post">
            <!---User Name-->
            <div class="mb-3">
                <label for="" class="form-label">User Name</label>
                <input
                    type="text"
                    class="form-control"
                    name="user"
                    id=""
                    aria-describedby="helpId"
                    placeholder=""
                    required
                />
                <small id="helpId" class=""
                    >Only registered users are up to login</small
                >
            </div>
            
            <!--Password-->
            <div class="mb-3">
                <label for="" class="form-label">Password</label>
                <input
                    type="password"
                    class="form-control"
                    name="pass"
                    id=""
                    placeholder=""
                    required
                />
            </div>
            
            <div class="d-grid gap-2">
                <button
                    type="submit"
                    name=""
                    id=""
                    class="btn btn-primary box-shadow-white"
                > Login
                </button>
            </div>
        </form>
    </div>
    
    <!--- Logo -->
    <div
        class="col-12  col-md-6   "
    >
            <!---Img-->
        <img
            src="static/img/Logo.png"
            class="Logo box-shadow-white"
            alt="image desc"
        />    
    </div>
    </div>  
</div>


{% include "bases/footer.html" %}
